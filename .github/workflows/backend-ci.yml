name: iComputers Backend CI

on:
  push:
    branches: [main, "security/**"]
    paths:
      - "**.js"
      - "controllers/**"
      - "models/**"
      - "routes/**"
      - "package.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.js"
      - "controllers/**"
      - "models/**"
      - "routes/**"
      - "package.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: find . -path ./node_modules -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run tests
        run: npm test
