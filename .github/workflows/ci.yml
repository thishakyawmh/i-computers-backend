name: Node.js CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, "audit/**"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and regenerate lockfile
        run: npm install --no-audit --no-fund
      - name: Apply compatible dependency security fixes
        run: npm audit fix || true
      - name: Commit regenerated lockfile to this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: regenerate dependency lockfile [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ": " + v.severity + " | range=" + v.range + " | fix=" + JSON.stringify(v.fixAvailable));'
      - name: Enforce no high or critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
